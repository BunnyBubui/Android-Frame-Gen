name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK dependencies
        run: |
          SDK="/usr/local/lib/android/sdk"
          SDKMGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMGR"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Native interpolation baseline
        run: |
          cmake -S native-tests -B build/native-tests
          cmake --build build/native-tests -j2
          ctest --test-dir build/native-tests --output-on-failure
      - name: Test host JNI bridge
        run: bash scripts/test-jni-host.sh
      - name: Verify Android source structure
        run: python3 scripts/validate_source.py
      - name: Android JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalFrameGen-v0.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
